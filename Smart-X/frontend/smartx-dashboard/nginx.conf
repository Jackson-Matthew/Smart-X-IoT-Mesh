server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are limited to 10 MB by the API; nginx's default limit is 1 MB,
    # so raise it slightly above the API limit.
    client_max_body_size 11m;

    # Forward API calls to the backend container ("api" is its name in
    # docker-compose.yml). The browser only talks to this server, so no CORS
    # or HTTPS certificate setup is needed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
